<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel Plan — Kế hoạch du lịch</title>
<meta name="theme-color" content="#FFF7EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travel Plan">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF7EC; --card:#FFFDF8; --peach:#FFE3D3; --peach2:#FFD9C0;
  --coral:#FF7A59; --coral-d:#F0562F; --teal:#2BB3A3; --teal-d:#157F74;
  --ink:#3E3A33; --muted:#8D8474; --line:#F3E3CF;
  --shadow:0 6px 20px rgba(190,120,70,.16);
  --r-lg:26px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0} html{background:#638986}
body{
  font-family:"Be Vietnam Pro","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink); min-height:100vh; min-height:calc(100dvh + 2px); position:relative;
}
body::before{content:none}
/* Nen MOT LOP DUY NHAT phu kin full-bleed tu mep nay sang mep kia, khop huong man hinh:
   man hinh NGANG (may tinh, tablet ngang) dung travel-bg-wide.jpg — artwork NGANG 16:9
   (2048x1152) khop man hinh 16:9 nen thay gan nhu DAY DU ca khung hinh: may bay tron o
   goc tren phai + vet khoi, hang dia danh day du phia duoi va bong phan chieu mat nuoc;
   man hinh DOC (dien thoai) dung travel-bg-portrait.jpg keo vua dung khung (100% 100%):
   artwork doc ti le 0,442 trong khi man hinh dien thoai ~0,46 nen cover bi cat dai
   phan chieu mat nuoc o day; keo vua khung thi toan bo hinh lọt tron trong man hinh —
   may bay phia tren va hang dia danh + mat nuoc phan chieu phia duoi deu thay du,
   do lech ti le chi ~4-5% nen tranh mau nuoc khong nhan ra meo.
   Khong con co che contain thanh cot + lam mo hai ben. */
#bg{position:fixed; top:0; left:0; right:0; height:var(--bgh, 100lvh); z-index:0; pointer-events:none; background:linear-gradient(180deg, rgba(255,247,236,.24), rgba(255,247,236,.38)), url("assets/travel-bg-wide.jpg") center/cover no-repeat #638986}
@media (orientation:portrait){
  #bg{background:linear-gradient(180deg, rgba(255,247,236,.24), rgba(255,247,236,.38)), url("assets/travel-bg-portrait.jpg") 50% 0/100% auto no-repeat #638986}
}
html:has(.home-frame) #bg{background:linear-gradient(180deg, rgba(255,247,236,.24), rgba(255,247,236,.38)), url("assets/travel-bg-wide-home.jpg") center/cover no-repeat #638986}
@media (orientation:portrait){
  html:has(.home-frame) #bg{background:linear-gradient(180deg, rgba(255,247,236,.24), rgba(255,247,236,.38)), url("assets/travel-bg-portrait-home.jpg") 50% 0/100% auto no-repeat #638986}
}
h1,h2,h3,.font-round{font-family:"Baloo 2","Be Vietnam Pro","Comic Sans MS","Chalkboard SE",system-ui,sans-serif}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--ink)}
img{display:block; max-width:100%}
.wrap{max-width:none; margin:0; padding:calc(env(safe-area-inset-top, 0px) + 4px) 12px 40px; position:relative; z-index:1}
/* Trang chu: can giua toan bo khoi noi dung theo chieu doc trong khung nhin */
.wrap:has(.home-frame){position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; display:flex; flex-direction:column; justify-content:center; padding-top:20px; padding-bottom:20px; overflow:hidden}
body:has(.home-frame){min-height:calc(100dvh + 2px); height:auto; overflow:visible}
#view:has(.home-frame){flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center}
@media (max-height:760px){
  .wrap:has(.home-frame){padding-top:10px; padding-bottom:10px}
  .wrap:has(.home-frame) .plane-wrap{width:104px; height:72px}
  .wrap:has(.home-frame) .home-frame{padding:14px 16px 12px}
  .wrap:has(.home-frame) .home-head h1{font-size:32px}
  .wrap:has(.home-frame) .date-row{margin-top:12px}
  .wrap:has(.home-frame) .cc-row{margin-top:10px}
  .wrap:has(.home-frame) .search-btn{margin-top:12px; padding:12px}
  .wrap:has(.home-frame) .nav-tile, .wrap:has(.home-frame) .user-tile{height:64px}
  .wrap:has(.home-frame) .nav-grid, .wrap:has(.home-frame) .auth-grid{margin-top:10px}
}
/* Man hep (<=419px): thu nho chu tieu de + may bay de "Travel Plan" vua mot dong, khong xuong hang */
@media (max-width:419px){
  .wrap:has(.home-frame) .home-head h1{font-size:29px}
  .wrap:has(.home-frame) .plane-wrap{width:100px; height:74px}
}
.card{background:var(--card); border:2px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:18px}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:999px; padding:12px 20px; font-weight:700; font-size:15px; transition:transform .08s, box-shadow .15s; border:2px solid transparent}
.btn:active{transform:scale(.97)}
.btn-coral{background:var(--coral); color:#fff; box-shadow:0 6px 14px rgba(255,122,89,.35)}
.btn-coral:hover{background:var(--coral-d)}
.btn-teal{background:var(--teal); color:#fff; box-shadow:0 6px 14px rgba(43,179,163,.3)}
.btn-teal:hover{background:var(--teal-d)}
.btn-ghost{background:#fff; border-color:var(--line); color:var(--ink)}
.btn-sm{padding:8px 14px; font-size:13px}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.chip{display:inline-flex; align-items:center; gap:5px; background:var(--peach); color:#9A4A21; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
label.flabel{display:block; font-weight:700; font-size:13px; margin:0 0 6px 2px; color:#6B6252}
.field{width:100%; background:#FFF9F0; border:2px solid var(--line); border-radius:var(--r-md); padding:12px 14px; outline:none}
.field:focus{border-color:var(--teal)}
textarea.field{resize:vertical; min-height:64px}

/* ===== Trang chu ===== */
.home-frame{padding:20px 18px 18px; background:rgba(255,253,248,.8); position:relative; z-index:40}
.home-frame .field, .home-frame .date-btn{background:rgba(255,249,240,.85)}
.home-head{display:flex; align-items:center; gap:10px}
.home-head h1{font-family:"Pacifico","Baloo 2",cursive; font-size:40px; margin:0; line-height:1.25; padding:2px 6px 8px 0; font-weight:400; letter-spacing:0; background:linear-gradient(92deg,#ef5d3a 0%,#e75480 52%,#17808a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; filter:drop-shadow(0 2px 3px rgba(39,65,86,.28))}
.home-head img{width:100%; height:100%; object-fit:contain; display:block}
.plane-wrap{position:relative; width:128px; height:96px; margin-left:auto; flex:none}
.plane-wrap img{animation:planeGlide 6s ease-in-out infinite; will-change:transform; filter:drop-shadow(0 5px 7px rgba(39,65,86,.20))}
@keyframes planeGlide{0%,100%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(-7px,-9px) rotate(-4deg)}55%{transform:translate(-2px,-13px) rotate(-1deg)}75%{transform:translate(5px,-6px) rotate(3deg)}}
@media (prefers-reduced-motion: reduce){.plane-wrap img{animation:none}}
.date-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.date-btn{width:100%; height:52px; text-align:left; background:#FFF9F0; border:2px solid var(--line); border-radius:var(--r-md); padding:12px 14px; font-size:15px; font-weight:600; display:flex; justify-content:space-between; align-items:center}
.date-btn .ph{color:var(--muted); font-weight:500}
.city-wrap{position:relative; margin-top:12px}
.cc-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px}
.cc-row .city-wrap{margin-top:0; min-width:0}
.cc-row .field{padding:12px 10px; height:52px}
/* Man hep (<=419px): cot Quoc gia rong hon mot chut + giam padding/co chu select de nhan "Chon quoc gia..." khong bi cat */
@media (max-width:419px){
  .cc-row{gap:8px; grid-template-columns:1.12fr .88fr}
  .cc-row .field{padding-left:7px; padding-right:7px}
  .cc-row select.field{font-size:15px}
}
.suggest{position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border:2px solid var(--line); border-radius:var(--r-md); box-shadow:0 14px 34px rgba(120,70,30,.28); max-height:min(320px, 48dvh); overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; z-index:30}
.suggest button{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; padding:11px 14px; font-size:15px; border-bottom:1px solid #FBF0DD}
.suggest button:last-child{border-bottom:none}
.suggest button:hover{background:#FFF4E4}
.suggest .ct{color:var(--muted); font-size:12px; font-weight:700}
.search-btn{width:100%; margin-top:16px; padding:15px; font-size:17px}
.nav-grid{display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:10px; margin-top:12px}
.nav-tile{background:rgba(255,253,248,.92); border:2px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:12px 8px 10px; display:flex; flex-direction:column; align-items:center; justify-content:center; height:76px; gap:4px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:15px; color:#274156}
.nav-tile .ic{font-size:24px; line-height:1; height:26px; display:flex; align-items:center; justify-content:center}
.nav-tile.on{background:var(--coral); border-color:var(--coral); color:#fff}
.nav-row{display:flex; gap:8px; margin-bottom:14px}
.nav-row button{flex:1; min-width:0; background:var(--card); border:2px solid var(--line); border-radius:999px; padding:9px 4px; font-weight:700; font-size:13px; box-shadow:var(--shadow)}
.nav-row button.on{background:var(--coral); border-color:var(--coral); color:#fff}
.tab-nav button{display:flex; flex-direction:column; align-items:center; justify-content:center; height:56px; gap:3px; padding:8px 2px 7px; line-height:1.1; white-space:nowrap}
.tab-nav button .ic{font-size:19px; line-height:1}
.tab-nav button .lb{font-size:12px; font-weight:700}

/* ===== Taskbar co dinh duoi day (chi dung trong Lich trinh) ===== */
.taskbar{position:fixed; left:0; right:0; bottom:0; z-index:60; transform:translateY(var(--gap, 0px)); background:rgb(255,253,248); border-top:2px solid var(--line); box-shadow:0 -6px 20px rgba(190,120,70,.14); padding:8px 10px calc(68px + env(safe-area-inset-bottom)); margin-bottom:-60px}
.taskbar-in{max-width:none; margin:0; display:flex; gap:6px}
.taskbar button{flex:1; min-width:0; height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 2px 3px; line-height:1.1; white-space:nowrap; color:var(--muted); border-radius:16px}
.taskbar button .ic{font-size:21px; line-height:1; padding:3px 14px; border-radius:999px}
.taskbar button .lb{font-size:12px; font-weight:700}
.taskbar button.on{color:var(--coral-d)}
.taskbar button.on .ic{background:var(--peach)}
.taskbar-spacer{height:calc(116px + env(safe-area-inset-bottom, 0px))}
body:has(.taskbar) .toast{bottom:106px}

/* ===== Lich trinh ===== */
.sec-title{font-size:24px; margin:6px 0 12px; color:#274156}
.city-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.city-tile{background:var(--card); border:2px solid var(--line); border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--shadow); text-align:left; padding:0; width:100%; position:relative}
.tile-del{position:absolute; top:8px; right:8px; z-index:2; min-width:28px; height:28px; padding:0 7px; border-radius:999px; background:rgba(255,255,255,.94); color:var(--coral-d); font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(90,50,20,.25); cursor:pointer}
.city-tile.on{border-color:var(--coral); box-shadow:0 0 0 2px var(--coral), var(--shadow)}
.city-tile img,.city-tile .ph-img{width:100%; height:86px; object-fit:cover}
.city-tile .in{padding:10px 12px 12px}
.city-tile .nm{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:17px; color:#274156; line-height:1.15}
.city-tile .dt{font-size:12px; color:var(--muted); margin-top:3px; font-weight:600}
.ph-img{background:linear-gradient(135deg,var(--peach),#BDEBE2); display:flex; align-items:center; justify-content:center; font-size:30px}
.city-head{display:flex; gap:12px; align-items:center}
.city-head img,.city-head .ph-img{width:56px; height:56px; border-radius:16px; object-fit:cover; flex:none}
.city-head .nm{font-family:"Baloo 2",sans-serif; font-size:21px; font-weight:800; color:#274156; line-height:1.1}
.city-head .dt{font-size:12px; color:var(--muted); font-weight:600; margin-top:2px}
.head-btns{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; align-items:stretch}
.head-btns .btn{width:100%; height:42px; min-width:0; padding:0 4px; font-size:12px; line-height:1; gap:4px; white-space:nowrap; overflow:hidden; display:flex; align-items:center; justify-content:center}
.head-btns .hb-ic{font-size:18px; line-height:1; width:22px; flex:0 0 22px; display:inline-flex; align-items:center; justify-content:center}
.head-btns .btn.saved{background:var(--teal); border-color:var(--teal); color:#fff}
@media(max-width:419px){ .head-btns{gap:4px} .head-btns .btn{gap:2px; padding:0 1px} .head-btns .hb-ic{width:20px; flex:0 0 20px} }
@media(max-width:374px){ .head-btns .hb-ic{width:19px; flex:0 0 19px} }
/* ===== Icon net SVG thay emoji o cac nut chuc nang: cung 1 phong cach net bo tron ===== */
.ic-svg{display:block; flex:none}
.nav-tile .ic{color:var(--teal-d)} .nav-tile.on .ic{color:#fff}
.nav-tile .ic .ic-svg{width:24px; height:24px}
.tab-nav button .ic{color:var(--teal-d)} .tab-nav button.on .ic{color:#fff}
.tab-nav button .ic .ic-svg{width:19px; height:19px}
.taskbar button .ic{color:#B4A88F} .taskbar button.on .ic{color:var(--teal-d)}
.taskbar button .ic .ic-svg{width:21px; height:21px}
.nav-tile.acct{flex-direction:row; gap:8px; font-size:14px}
.nav-tile.acct .u-av{width:30px; height:30px; border-radius:50%; object-fit:cover; flex:none}
.nav-tile.acct .u-ic{color:var(--teal-d)}
.nav-tile.acct .u-ic .ic-svg{width:24px; height:24px}
.nav-tile.acct .u-name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.menu-list{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.menu-item{display:flex; align-items:center; gap:10px; width:100%; padding:13px 14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-family:"Baloo 2",sans-serif; font-weight:700; font-size:15px; color:#274156; text-align:left}
.menu-item.danger{color:#c2452d; border-color:#f0c9bd}
.acct-info{display:flex; align-items:center; gap:10px}
.acct-info img{width:40px; height:40px; border-radius:50%; object-fit:cover}
.acct-name{font-weight:800; font-size:16px; color:#274156}
.acct-mail{font-size:12.5px; color:var(--muted)}
.user-tile .u-ic{color:var(--teal-d)}
.user-tile .u-ic .ic-svg{width:24px; height:24px}
.btn .ic-svg{width:17px; height:17px}
.btn-sm .ic-svg{width:14px; height:14px}
.head-btns .hb-ic .ic-svg{width:20px; height:20px}
.head-btns .btn-ghost .hb-ic{color:var(--teal-d)}
.head-btns #btn-del-trip .hb-ic{color:var(--coral-d)}
@media(max-width:419px){ .head-btns .hb-ic .ic-svg{width:11px; height:11px} }
@media(max-width:374px){ .head-btns .hb-ic .ic-svg{width:10px; height:10px} }
.spk{display:inline-flex; align-items:center; justify-content:center; color:var(--teal-d)}
.spk .ic-svg{width:19px; height:19px}
.nav-row:not(.tab-nav) button .ic-svg{display:inline-block; width:13px; height:13px; vertical-align:-2px; margin-right:4px; color:var(--coral-d)}
/* ===== Chuyen giua cac trang chinh: mo dan + truot len nhe ===== */
#view > *{animation:viewIn .3s ease both}
@keyframes viewIn{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){#view > *{animation:none}}
/* ===== Man hinh cho (splash) — sao dung hieu ung vao cua ban Muse:
   may bay chibi bay ngang qua vet dut net (chung chuyen dong voi hieu ung
   cho PlaneLoader cua app), ten app o duoi, tren nen artwork cua app ===== */
#splash{position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; text-align:center; cursor:pointer; overflow:hidden; background:linear-gradient(rgba(255,246,236,.55), rgba(255,246,236,.55)), url("assets/travel-bg-wide.jpg") center/cover no-repeat; transition:opacity .5s ease-out; animation:splashKill .6s ease 4.5s forwards}
@media (orientation:portrait){ #splash{background:linear-gradient(rgba(255,246,236,.55), rgba(255,246,236,.55)), url("assets/travel-bg-portrait.jpg") 50% 0/100% auto no-repeat} }
#splash{background-color:#FFF6EC}
#splash.bye{opacity:0; pointer-events:none}
#splash .splash-inner{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; transition:transform .5s ease-out}
#splash.bye .splash-inner{transform:translateY(-12px)}
@keyframes splashKill{to{opacity:0; visibility:hidden}}
.splash-track{position:relative; display:block; height:96px; width:304px; max-width:82vw}
.splash-line{display:none}
.splash-plane{position:absolute; top:10px; left:-88px; width:96px; animation:splashFlyAcross 3.2s linear infinite; will-change:left,transform; filter:drop-shadow(0 8px 12px rgba(229,80,47,.28))}
@keyframes splashFlyAcross{0%{left:-88px; transform:translateY(0) rotate(-2deg)}25%{transform:translateY(-9px) rotate(1.5deg)}50%{transform:translateY(-2px) rotate(-1deg)}75%{transform:translateY(-10px) rotate(2deg)}100%{left:100%; transform:translateY(0) rotate(-2deg)}}
@media (prefers-reduced-motion: reduce){.splash-plane{animation:none; left:50%; transform:translateX(-50%)}}
.splash-name{margin-top:4px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:48px; line-height:1; color:#274156}
/* Ban giao splash -> trang chu: trang ben duoi mo dan + troi len vao cho
   (class .app-enter gan vao #view ngay khi splash bat dau roi di) */
@keyframes appEnter{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.app-enter{animation:appEnter .6s ease-out both}
@media (prefers-reduced-motion: reduce){.app-enter{animation:none}}
.day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
.day-tile{background:#fff; border:2px solid var(--line); border-radius:var(--r-md); padding:10px 8px; text-align:center; box-shadow:var(--shadow)}
.day-tile .d1{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:17px; color:#274156}
.day-tile .d2{font-size:11px; color:var(--muted); font-weight:600; margin-top:1px}
.day-tile .d3{font-size:11px; margin-top:5px}
.day-tile.on{background:var(--coral); border-color:var(--coral)}
.day-tile.on .d1,.day-tile.on .d2{color:#fff}
.day-big{font-family:"Baloo 2",sans-serif; font-size:32px; font-weight:800; color:#274156; line-height:1.05; margin:0}
.day-sub{color:var(--teal-d); font-weight:700; font-size:16px; margin-top:2px}
.day-divider{border:none; border-top:1px solid var(--line); margin:12px 0 14px}
.place-card{display:flex; gap:12px; background:#fff; border:2px solid var(--line); border-radius:var(--r-md); padding:10px; margin-bottom:10px}
.place-card img,.place-card .ph-img{width:84px; height:84px; border-radius:12px; object-fit:cover; flex:none}
.place-card .nm{font-weight:700; font-size:15px; line-height:1.25}
.place-card .ds{font-size:12.5px; color:var(--muted); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.place-card .go{font-size:12.5px; margin-top:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.place-card.done{border-color:#7BC5A8; background:#F2FBF6}
.place-card .vchip{display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:2px 9px; font-size:11.5px; font-weight:800; margin-left:8px; vertical-align:2px}
.place-card .vchip.yes{background:#DFF5E9; color:#157347}
.place-card .vchip.no{background:#F1EDE6; color:#8A7B68}

<script>
"use strict";
/* ================= Tien ich ================= */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d").trim();
const WD = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
const WD2 = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
function parseD(iso) { if (!iso) return null; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function toISO(dt) { const p = (n) => String(n).padStart(2, "0"); return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate()); }
function todayISO() { return toISO(new Date()); }
function fmtD(iso) { const d = parseD(iso); if (!d) return ""; return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear(); }
function fmtFull(iso) { const d = parseD(iso); if (!d) return ""; return WD[d.getDay()] + ", " + d.getDate() + "/" + (d.getMonth() + 1) + "/" + d.getFullYear(); }
function dayCount(a, b) { const d1 = parseD(a), d2 = parseD(b); if (!d1 || !d2) return 0; return Math.round((d2 - d1) / 86400000) + 1; }
function addDays(iso, n) { const d = parseD(iso); d.setDate(d.getDate() + n); return toISO(d); }
function toast(msg) {
  const r = $("#toast-root"); r.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toast._t); toast._t = setTimeout(() => r.innerHTML = "", 2600);

/* ===== Hieu ung dang tai: may bay dang bay ===== */
let loadPending = 0, loadTimer = null, loadHold = false;
function loaderShow(text) { const l = document.getElementById("loader"); if (!l) return; if (text) document.getElementById("loader-text").textContent = text; l.classList.add("show"); }
function loaderHide() { const l = document.getElementById("loader"); if (l) l.classList.remove("show"); }
function loaderOn() {
  loadPending++;
  if (loadPending === 1 && !loadHold) { clearTimeout(loadTimer); loadTimer = setTimeout(() => loaderShow("Đang tải… ✈️"), 300); }
}
function loaderOff() {
  loadPending = Math.max(0, loadPending - 1);
  if (loadPending === 0) { clearTimeout(loadTimer); if (!loadHold) loaderHide(); }
}
function loaderHoldShow(text) { loadHold = true; clearTimeout(loadTimer); loaderShow(text); }
function loaderRelease() { loadHold = false; if (loadPending === 0) loaderHide(); }
window.addEventListener("pageshow", (e) => { if (e.persisted) { loadHold = false; loadPending = 0; loaderHide(); } });
async function api(path, method, body, opts) {
  const silent = !!(opts && opts.silent);
  if (!silent) loaderOn();
  try {
    const r = await fetch(path, { method: method || "GET", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Có lỗi xảy ra");
    return j;
  } finally { if (!silent) loaderOff(); }
}
function phImg(cls) { return '<div class="ph-img ' + (cls || "") + '">🧳</div>'; }

function guideOf(trip) { return trip && trip.guideKey ? GUIDES[trip.guideKey] : null; }
function tipsArray(g) { if (!g || !g.transportTips) return []; return Array.isArray(g.transportTips) ? g.transportTips.filter(Boolean) : [g.transportTips]; }
function tipsText(g) { return tipsArray(g).join(" "); }
function tipsHTML(g) { const a = tipsArray(g); if (!a.length) return ""; if (a.length === 1) return '<p style="line-height:1.55">' + esc(a[0]) + "</p>"; return '<ul class="tips-list">' + a.map(t => "<li>" + esc(t) + "</li>").join("") + "</ul>"; }
function findGuideByCity(cityName) {
  const n = norm(cityName);
  for (const k in GUIDES) if (norm(GUIDES[k].name) === n) return GUIDES[k];
  return null;
}
function countryOfCity(cityName) {
  const n = norm(cityName);
  const hit = CITYLIST.find(c => norm(c.name) === n);
  if (hit) return hit.country;
  const g = findGuideByCity(cityName);
  return g ? g.country : "";
}

function flagOf(country) { return FLAGS[country] || "🌍"; }
function countryOptions() {
  const out = [], seen = new Set();
  const push = (c) => { if (c && !seen.has(c)) { seen.add(c); out.push(c); } };
  CITYLIST.forEach(c => push(c.country));
  for (const k in GUIDES) push(GUIDES[k].country);
  return out;
}
function citiesOfCountry(country) {
  const out = [], seen = new Set();
  const push = (name) => { const k = norm(name); if (name && !seen.has(k)) { seen.add(k); out.push(name); } };
  CITYLIST.filter(c => c.country === country).forEach(c => push(c.name));
  for (const k in GUIDES) if (GUIDES[k].country === country) push(GUIDES[k].name);
  return out;
}

let suggCache = { country: "", list: [] };
function citySearchList(country) {
  if (suggCache.country !== country) {
    suggCache = { country, list: citiesOfCountry(country).map(n => ({ n, k: norm(n) })) };
  }
  return suggCache.list;
}

/* ================= Popup ================= */
let modalLockCount = 0, modalSavedY = 0;
function lockScroll() {
  if (modalLockCount === 0) {
    modalSavedY = window.scrollY || 0;
    document.body.style.top = -modalSavedY + "px";
    document.body.classList.add("modal-locked");
  }
  modalLockCount++;
}
function unlockScroll() {
  modalLockCount = Math.max(0, modalLockCount - 1);
  if (modalLockCount === 0) {
    document.body.classList.remove("modal-locked");
    document.body.style.top = "";
    window.scrollTo(0, modalSavedY);
  }
}
function openModal(html, variant) {
  // Popup XEP CHONG: moi lan mo la mot lop rieng tren #modal-root, dong chi tat lop cua minh.
  // (Truoc day openModal thay the toan bo #modal-root nen mo lich chon ngay ben trong
  //  form Sua chuyen di da xoa mat form -> bam Luu khong duoc.)
  const host = $("#modal-root");
  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="modal-bg' + (variant === "cal" ? " cal-bg" : "") + (variant === "guide" ? " guide-bg" : "") + '"><div class="modal' + (variant === "cal" ? " cal-modal" : "") + (variant === "detail" ? " detail-modal" : "") + (variant === "guide" ? " guide-modal" : "") + '"><button class="x" id="modal-x">✕</button>' + html + "</div></div>";
  host.appendChild(wrap);
  lockScroll();
  let closed = false;
  const close = () => { if (closed) return; closed = true; wrap.remove(); unlockScroll(); };
  $("#modal-x", wrap).onclick = close;
  $(".modal-bg", wrap).addEventListener("click", (e) => { if (e.target.classList.contains("modal-bg")) close(); });
  return { root: wrap, close };
}

/* ================= Lich chon ngay (tu dung, phong cach chibi) =================
   - Khong dung lich mac dinh cua trinh duyet.
   - Ngay hien tai (hom nay) duoc danh dau: vien san ho + cham do; popup co nut "Hom nay" co dinh o chan. */
function dateFieldHTML(id, value, placeholder) {
  return '<button type="button" class="date-btn" id="' + id + '"><span class="' + (value ? "" : "ph") + '">' + (value ? fmtD(value) : placeholder) + '</span><span>📅</span></button>';
}
function attachDateField(id, getVal, setVal, opts) {
  opts = opts || {};
  const el = document.getElementById(id);
  if (!el) return;
  el.onclick = () => openCalendar({
    value: getVal(),
    min: typeof opts.min === "function" ? opts.min() : (opts.min || null),
    anchor: typeof opts.anchor === "function" ? opts.anchor() : (opts.anchor || null),
    onPick: (iso) => { setVal(iso); }
  });
}
function openCalendar({ value, min, anchor, onPick }) {
  const today = todayISO();
  // Mac dinh: chua co ngay -> chon san hom nay (hoac ngay min neu min o tuong lai)
  let selected = value || (min && min > today ? min : today);
  let view = parseD(value || anchor || selected);
  view = new Date(view.getFullYear(), view.getMonth(), 1);
  const { root, close } = openModal('<div class="cal-wrap"><h3>Chọn ngày</h3><div class="cal" id="cal-box"></div><div class="cal-foot"><button class="btn btn-ghost btn-sm" id="cal-clear">Xóa ngày</button><button class="btn btn-teal btn-sm" id="cal-today">Hôm nay</button><button class="btn btn-coral btn-sm" id="cal-ok">Xong</button></div></div>', "cal");
  function render() {
    const y = view.getFullYear(), m = view.getMonth();
    const first = new Date(y, m, 1);
    const startOffset = (first.getDay() + 6) % 7; // tuan bat dau Thu 2
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let cells = "";
    ["T2", "T3", "T4", "T5", "T6", "T7", "CN"].forEach(w => cells += '<div class="wd">' + w + "</div>");
    for (let i = 0; i < startOffset; i++) cells += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
      const iso = toISO(new Date(y, m, d));
      const cls = ["cal-day"];
      if (iso === today) cls.push("today");
      if (iso === selected) cls.push("sel");
      if (min && iso < min) cls.push("dis");
      cells += '<button class="' + cls.join(" ") + '" data-iso="' + iso + '">' + d + "</button>";
    }
    for (let i = startOffset + daysInMonth; i < 42; i++) cells += '<div class="cal-day empty"></div>';
    $("#cal-box", root).innerHTML =
      '<div class="cal-head"><button class="cal-nav" id="cal-prev">‹</button><div class="t">Tháng ' + (m + 1) + " năm " + y + '</div><button class="cal-nav" id="cal-next">›</button></div>' +
      '<div class="cal-grid">' + cells + "</div>";
    $("#cal-prev", root).onclick = () => { view = new Date(y, m - 1, 1); render(); };
    $("#cal-next", root).onclick = () => { view = new Date(y, m + 1, 1); render(); };
    $$(".cal-day[data-iso]", root).forEach(b => b.onclick = () => { selected = b.dataset.iso; render(); });
  }
  render();
  $("#cal-today", root).onclick = () => {
    const t = parseD(today);
    view = new Date(t.getFullYear(), t.getMonth(), 1);
    if (!min || today >= min) selected = today;
    render();
  };
  $("#cal-clear", root).onclick = () => { onPick(""); close(); };
  $("#cal-ok", root).onclick = () => { if (selected) onPick(selected); close(); };
}

function bindNav(scope) {
  $$("[data-tab]", scope).forEach(b => b.onclick = () => goTab(b.dataset.tab));
  $$("[data-journal]", scope).forEach(b => b.onclick = openJournalPopup);
}
async function goTab(t) {
  tab = t;
  if (t === "itinerary" && selTripId && (!curTrip || curTrip.id !== selTripId)) {
    try { curTrip = await api("/api/trips/" + selTripId); } catch {}
  }
  render();
  window.scrollTo({ top: 0 });
}
function render() {
  const y = window.scrollY;
  const v = $("#view");
  if (tab === "home") renderHome(v);
  else if (tab === "itinerary") renderItinerary(v);
  else if (tab === "phrases") renderPhrases(v);
  else if (tab === "prep") renderPrep(v);
  window.scrollTo({ top: y });
}

async function openJournalPopup() {
  if (!ME) { toast("Bạn đăng nhập trước để xem Nhật ký nhé 🔐"); return; }
  const { root } = openModal('<h3>📓 Nhật ký của bạn</h3><div id="j-list"><div class="empty-note">Đang tải…</div></div>');
  let list;
  try { list = await api("/api/journal"); }
  catch (e) { const el = $("#j-list", root); if (el) el.innerHTML = '<div class="empty-note">' + esc(e.message) + "</div>"; return; }
  journalIds = new Set(list.map(e => e.tripId));
  const box = $("#j-list", root);
  if (!box) return;
  if (!list.length) {
    box.innerHTML = '<div class="empty-note">Chưa có thành phố nào được lưu.</div>';
    return;
  }
  // Anh dai dien cua mot thanh pho da luu: hero trong snapshot -> hero cam nang -> anh dia diem dau tien
  function entryHero(e) {
    if (e.hero) return e.hero;
    const gd = findGuideByCity(e.city);
    if (gd && gd.hero) return gd.hero;
    for (const d of Object.keys(e.days || {})) { const f = (e.days[d] || []).find(p => p.image); if (f) return f.image; }
    return null;
  }
  // Nhat ky phang: moi muc la MOT thanh pho (ten thanh pho + quoc gia), an vao mo thang lich trinh tung ngay
  function entryDaysHtml(e) {
    return Object.keys(e.days || {}).sort((a, b) => Number(a) - Number(b)).map(d => {
      const ps = e.days[d] || [];
      if (!ps.length) return "";
      const date = addDays(e.start, Number(d) - 1);
      return '<div class="j-day">Ngày ' + d + " · " + fmtD(date) + "</div>" + ps.map(p =>
        '<div class="j-place">' + (p.image ? '<img class="j-thumb xs" src="' + esc(p.image) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
        '<div class="nm">📍 ' + esc(p.name) + (p.dur ? ' <span class="muted" style="font-weight:400">· ⏱️ ' + esc(p.dur) + "</span>" : "") + "</div></div>"
      ).join("");
    }).join("");
  }
  function paint() {
    const items = [...list].sort((a, b) => String(a.start || "").localeCompare(String(b.start || "")));
    box.innerHTML = items.map(e => {
      const n = dayCount(e.start, e.end);
      const eh = entryHero(e);
      const title = e.city + (e.country ? " · " + e.country : "");
      return '<div class="j-item">' +
        '<div style="display:flex;gap:6px;align-items:flex-start">' +
          '<button class="j-head" style="flex:1;min-width:0" data-j-open="' + e.id + '">' +
            (eh ? '<img class="j-thumb" src="' + esc(eh) + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
            '<span style="flex:1;min-width:0"><span class="j-title">' + (e.country ? flagOf(e.country) + " " : "") + esc(title) + '</span>' +
            '<span class="j-sub" style="display:block">' + fmtD(e.start) + " → " + fmtD(e.end) + " · " + n + " ngày · " + (e.placeCount || 0) + " điểm đến</span></span>" +
          "</button>" +
          '<button class="j-del" data-j-del="' + e.id + '" title="Xóa khỏi Nhật ký">' + ic("trash") + "</button>" +
        "</div>" +
        '<div class="j-days" data-j-days="' + e.id + '">' + (entryDaysHtml(e) || '<div class="small muted">Chưa có địa điểm nào trong lịch trình.</div>') + "</div>" +
      "</div>";
    }).join("");
    $$("[data-j-open]", box).forEach(b => b.onclick = () => {
      const el = $('[data-j-days="' + b.dataset.jOpen + '"]', box);
      el.style.display = el.style.display === "block" ? "none" : "block";
    });
    $$("[data-j-del]", box).forEach(b => b.onclick = async () => {
      try {
        await api("/api/journal/" + b.dataset.jDel, "DELETE");
        list = list.filter(x => x.id !== b.dataset.jDel);
        journalIds = new Set(list.map(x => x.tripId));
        toast("Đã xóa khỏi Nhật ký");
        if (!list.length) box.innerHTML = '<div class="empty-note">Chưa có thành phố nào được lưu.</div>';
        else paint();
        render();
      } catch (err) { toast(err.message); }
    });
  }
  paint();
}

/* ================= TRANG CHU ================= */
let homeForm = { start: "", end: "", city: "", country: "" };
function renderHome(v) {
  v.innerHTML =
    '<div class="card home-frame">' +
      '<div class="home-head"><h1>Travel Plan</h1></div>' +
      '<div class="date-row">' +
        '<div><label class="flabel">Ngày đi</label>' + dateFieldHTML("f-start", homeForm.start, "Chọn ngày đi") + "</div>" +
        '<div><label class="flabel">Ngày về</label>' + dateFieldHTML("f-end", homeForm.end, "Chọn ngày về") + "</div>" +
      "</div>" +
      '<div class="cc-row">' +
      '<div class="city-wrap"><label class="flabel">Quốc gia</label>' +
        '<select class="field" id="f-country"><option value="">Chọn quốc gia…</option>' +
        countryOptions().map(c => '<option value="' + esc(c) + '"' + (homeForm.country === c ? " selected" : "") + ">" + flagOf(c) + " " + esc(c) + "</option>").join("") +
        "</select></div>" +
      '<div class="city-wrap"><label class="flabel">Thành phố</label>' +
        '<select class="field" id="f-city"' + (homeForm.country ? "" : " disabled") + '><option value="">Chọn thành phố…</option>' +
        (homeForm.country ? citySearchList(homeForm.country).map(it => '<option value="' + esc(it.n) + '"' + (homeForm.city === it.n ? " selected" : "") + ">" + esc(it.n) + "</option>").join("") : "") +
        "</select></div>" +
      "</div>" +
      '<button class="btn btn-coral search-btn" id="f-search">' + ic("plane") + 'Tạo chuyến đi</button>' +
    "</div>" +
    authBarHTML() +
    '<div class="nav-grid">' + TABS.map(t => '<button class="nav-tile ' + (tab === t.id ? "on" : "") + '" data-tab="' + t.id + '"><span class="ic">' + ic(t.icon) + '</span>' + t.label + "</button>").join("") + "</div>";

  const paintDate = (id, val, ph) => { const b = document.getElementById(id); if (!b) return; const sp = b.querySelector("span"); if (sp) { sp.textContent = val ? fmtD(val) : ph; sp.className = val ? "" : "ph"; } };
  attachDateField("f-start", () => homeForm.start, (iso) => { homeForm.start = iso; if (homeForm.end && iso && homeForm.end < iso) { homeForm.end = ""; paintDate("f-end", "", "Chọn ngày về"); } paintDate("f-start", homeForm.start, "Chọn ngày đi"); });
  attachDateField("f-end", () => homeForm.end, (iso) => { homeForm.end = iso; paintDate("f-end", homeForm.end, "Chọn ngày về"); }, { min: () => homeForm.start || null, anchor: () => homeForm.start || null });

  const countrySel = $("#f-country", v), citySel = $("#f-city", v);
  const fillCities = () => {
    if (!citySel) return;
    const list = homeForm.country ? citySearchList(homeForm.country) : [];
    citySel.innerHTML = '<option value="">Chọn thành phố…</option>' + list.map(it => '<option value="' + esc(it.n) + '">' + esc(it.n) + "</option>").join("");
    citySel.disabled = !homeForm.country;
  };
  countrySel.onchange = () => { homeForm.country = countrySel.value; homeForm.city = ""; fillCities(); };
  if (citySel) citySel.onchange = () => { homeForm.city = citySel.value; };

  $("#f-search", v).onclick = async () => {
    const city = (homeForm.city || "").trim();
    if (!homeForm.country) return toast("Bạn chọn quốc gia muốn đến nhé 🌍");
    if (!city) return toast("Bạn chọn thành phố muốn đến nhé ✈️");
    if (!homeForm.start || !homeForm.end) return toast("Bạn chọn ngày đi và ngày về nhé 📅");
    if (homeForm.end < homeForm.start) return toast("Ngày về phải sau ngày đi nhé");
    // Uu tien quoc gia nguoi dung da chon neu thanh pho thuoc danh muc cua quoc gia do
    // (tranh nham voi thanh pho trung ten o nuoc khac)
    const ctry = citySearchList(homeForm.country).some(it => it.k === norm(city)) ? homeForm.country : (countryOfCity(city) || homeForm.country);
    let guide = findGuideByCity(city);
    if (!guide) {
      // Thanh pho chua co cam nang dong san: nho server tu lap tu Wikipedia (co the mat vai giay)
      try {
        toast("Đang soạn cẩm nang cho " + city + "… 🧭");
        const g2 = await api("/api/guide?city=" + encodeURIComponent(city) + "&country=" + encodeURIComponent(ctry));
        if (g2 && g2.key) { GUIDES[g2.key] = g2; guide = g2; }
      } catch (e) { /* khong co cam nang thi van tao chuyen nhu cu */ }
    }
    try {
      const trip = await api("/api/trips", "POST", { city, country: ctry, guideKey: guide ? guide.key : null, startDate: homeForm.start, endDate: homeForm.end });
      trips = await api("/api/trips");
      curTrip = trip; selTripId = trip.id; curDay = 1; prepTripId = trip.id;
      tab = "itinerary";
      toast("Đã tạo chuyến đi " + city + " 🎉");
      render();
      window.scrollTo({ top: 0 });
    } catch (e) { toast(e.message); }
  };
  bindNav(v);
  bindAuthBar(v);
}

/* ================= LICH TRINH ================= */
function tripHero(t) {
  const g = GUIDES[t.guideKey];
  if (g && g.hero) return g.hero;
  if (g && g.places && g.places.length && g.places[0].image) return g.places[0].image;
  return null;
}
function renderItinerary(v) {
  let html = '';
  if (!trips.length) {
    html += '<div class="empty-note">Chưa có chuyến đi nào.</div>';
    html += '<div class="taskbar-spacer"></div>' + taskbarHTML();
    v.innerHTML = html; bindNav(v); return;
  }
  html += '<div class="city-grid">' + trips.map(t => {
    const hero = tripHero(t);
    const n = dayCount(t.startDate, t.endDate);
    return '<button class="city-tile ' + (selTripId === t.id ? "on" : "") + '" data-trip="' + t.id + '">' +
      '<span class="tile-del" data-del-trip="' + t.id + '" title="Xóa chuyến này">✕</span>' +
      (hero ? '<img src="' + esc(hero) + '" alt="" loading="lazy" onerror="this.outerHTML=phImg()">' : phImg()) +
      '<div class="in"><div class="nm">' + esc(t.city) + '</div><div class="dt">' + fmtD(t.startDate) + " → " + fmtD(t.endDate) + " · " + n + " ngày</div></div></button>";
  }).join("") + "</div>";
  html += '<div id="trip-detail" class="mt"></div>';
  html += '<div class="taskbar-spacer"></div>' + taskbarHTML();
  v.innerHTML = html; bindNav(v);
  $$("[data-trip]", v).forEach(b => b.onclick = async () => {
    selTripId = b.dataset.trip; curDay = 1;
    try { curTrip = await api("/api/trips/" + selTripId); } catch (e) { toast(e.message); }
    prepTripId = selTripId;
    render();
  });
  $$("[data-del-trip]", v).forEach(x => x.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    const id = x.dataset.delTrip;
    api("/api/trips/" + id, "DELETE").then(async () => {
      trips = await api("/api/trips");
      if (curTrip && curTrip.id === id) { curTrip = null; selTripId = trips.length ? trips[0].id : null; }
      else if (selTripId === id) { selTripId = trips.length ? trips[0].id : null; }
      toast("Đã xóa chuyến đi");
      render();
    }).catch(err => toast(err.message));
  });
  if (curTrip && selTripId === curTrip.id) renderTripDetail($("#trip-detail", v));
  else if (selTripId) { api("/api/trips/" + selTripId).then(t => { curTrip = t; render(); }).catch(() => {}); }
}

function renderTripDetail(box) {
  if (!box || !curTrip) return;
  const t = curTrip, g = guideOf(t);
  const n = dayCount(t.startDate, t.endDate);
  const hero = tripHero(t);
  if (curDay > n) curDay = 1;
  let html = '<div class="card">' +
    '<div class="city-head">' + (hero ? '<img src="' + esc(hero) + '" alt="" onerror="this.outerHTML=phImg()">' : phImg()) +
      '<div><div class="nm">' + esc(t.city) + '</div><div class="dt">' + fmtD(t.startDate) + " → " + fmtD(t.endDate) + " · " + n + " ngày " + (n - 1) + " đêm" + (t.country ? " · " + esc(t.country) : "") + "</div></div></div>" +
    '<div class="head-btns">' +
      '<button class="btn btn-teal btn-sm" id="btn-guide" title="Cẩm nang" aria-label="Cẩm nang"><span class="hb-ic">' + ic("book") + '</span></button>' +
      '<button class="btn btn-ghost btn-sm' + (journalIds.has(t.id) ? " saved" : "") + '" id="btn-save-journal" title="' + (journalIds.has(t.id) ? "Đã lưu vào Nhật ký" : "Lưu vào Nhật ký") + '" aria-label="Lưu vào Nhật ký"><span class="hb-ic">' + ic("bookmark") + '</span></button>' +
      '<button class="btn btn-ghost btn-sm" id="btn-edit-trip" title="Chỉnh sửa" aria-label="Chỉnh sửa"><span class="hb-ic">' + ic("pen") + '</span></button>' +
      '<button class="btn btn-ghost btn-sm" id="btn-del-trip" title="Xóa chuyến" aria-label="Xóa chuyến"><span class="hb-ic">' + ic("trash") + '</span></button>' +
    "</div>" +
    '<div class="mt" id="stay-box">' + stayHTML(t) + "</div>" +
  "</div>";

  // Luoi chon ngay
  html += '<div class="card mt"><div class="day-grid">' + Array.from({ length: n }, (_, i) => {
    const d = i + 1, iso = addDays(t.startDate, i), cnt = (t.days[d] || []).length, doneN = (t.days[d] || []).filter(p => p.visited).length;
    return '<button class="day-tile ' + (curDay === d ? "on" : "") + '" data-day="' + d + '"><div class="d1">Ngày ' + d + '</div><div class="d2">' + WD2[parseD(iso).getDay()] + ", " + parseD(iso).getDate() + "/" + (parseD(iso).getMonth() + 1) + '</div><div class="d3"><span class="chip">' + cnt + " điểm đến" + "</span></div></button>";
  }).join("") + "</div></div>";

  // The ngay dang chon
  const dayISO = addDays(t.startDate, curDay - 1);
  const places = t.days[curDay] || [];
  html += '<div class="card mt"><h3 class="day-big">Ngày ' + curDay + '</h3><div class="day-sub">' + fmtFull(dayISO) + '</div><hr class="day-divider">';
  if (places.length) { const dn = places.filter(p => p.visited).length; html += '<div class="day-progress"><div class="bar"><div style="width:' + Math.round(dn / places.length * 100) + '%"></div></div><span class="txt">Đã đi ' + dn + '/' + places.length + ' điểm</span></div>'; }
  if (!places.length) html += '<div class="muted" style="font-weight:600">Chưa có địa điểm nào trong ngày này.</div>';
  html += places.map(p =>
    '<div class="place-card' + (p.visited ? ' done' : '') + '"><button class="visit-btn' + (p.visited ? ' on' : '') + '" data-visited="' + p.id + '" title="' + (p.visited ? 'Đã đi — ấn để bỏ đánh dấu' : 'Đánh dấu đã đi') + '">✓</button>' + imgOr(p) + '<div style="flex:1;min-width:0"><div class="nm">' + esc(p.name) + '<span class="vchip ' + (p.visited ? 'yes' : 'no') + '">' + (p.visited ? '✓ Đã đi' : 'Chưa đi') + '</span></div>' +
    (p.desc ? '<div class="ds">' + esc(p.desc) + "</div>" : "") +
    (p.go ? '<div class="go">🚌 ' + esc(p.go) + "</div>" : "") +
    '<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-teal btn-sm" data-detail="' + p.id + '">Chi tiết</button>' +
    '<button class="btn btn-ghost btn-sm" data-del-place="' + p.id + '">' + ic("trash") + 'Xóa</button></div></div></div>'
  ).join("");
  html += '<button class="btn btn-coral" id="btn-add-place" style="width:100%;margin-top:6px">Thêm lịch trình</button></div>';

  box.innerHTML = html;

  $("#btn-guide", box).onclick = () => openGuidePopup(t);
  $("#btn-save-journal", box).onclick = async () => {
    if (!ME) return toast("Bạn đăng nhập trước để lưu vào Nhật ký nhé 🔐");
    try {
      await api("/api/journal", "POST", { tripId: t.id });
      journalIds.add(t.id);
      toast("Đã lưu " + t.city + " vào Nhật ký 📓");

  $("#btn-edit-trip", box).onclick = () => openEditTripPopup(t);
  $("#btn-del-trip", box).onclick = () => {

      trips = await api("/api/trips");
      if (curTrip && curTrip.id === t.id) { curTrip = null; selTripId = trips.length ? trips[0].id : null; }
      toast("Đã xóa chuyến đi");
      render();
    }).catch(err => toast(err.message));
  };
  bindStay(box, t);
  $$("[data-day]", box).forEach(b => b.onclick = () => { curDay = Number(b.dataset.day); render(); });
  $$("[data-detail]", box).forEach(b => b.onclick = () => {
    const p = (curTrip.days[curDay] || []).find(x => x.id === b.dataset.detail);
    if (p) {
      const gp = g ? (g.places.find(x => x.id === p.id) || g.places.find(x => norm(x.name) === norm(p.name))) : null;
      const full = gp ? Object.assign({}, gp, p, { transit: p.transit || gp.transit, tips: p.tips || gp.tips, steps: (p.steps && p.steps.length) ? p.steps : gp.steps, nearby: (p.nearby && (p.nearby.food.length || p.nearby.play.length || p.nearby.shop.length)) ? p.nearby : gp.nearby }) : p;
      openPlaceDetail(full, g ? tipsText(g) : null);
    }
  });
  $$("[data-del-place]", box).forEach(b => b.onclick = async () => {
    const arr = curTrip.days[curDay] || [];
    const ix = arr.findIndex(x => x.id === b.dataset.delPlace);
    if (ix < 0) return;
    const removed = arr.splice(ix, 1)[0];
    // Xoa ngay tai cho, khong ve lai ca trang (tranh nhay man hinh); loi luu moi khoi phuc the ve cho cu

        const txt = prog.querySelector(".txt"); if (txt) txt.textContent = "Đã đi " + dn + "/" + arr.length + " điểm";
      }
      const tileChip = box.querySelector('.day-tile[data-day="' + curDay + '"] .chip');
      if (tileChip) tileChip.textContent = arr.length + " điểm đến";
    };
    if (cardEl) cardEl.remove();
    if (!arr.length) {
      if (prog) prog.remove();
      if (dayCard) {
        noteEl = document.createElement("div");
        noteEl.className = "muted"; noteEl.style.fontWeight = "600";
        noteEl.textContent = "Chưa có địa điểm nào trong ngày này.";
        dayCard.insertBefore(noteEl, dayCard.querySelector("#btn-add-place"));
      }
    }
    syncDayMeta();
    try { await api("/api/trips/" + t.id + "/days/" + curDay + "/places/" + removed.id, "DELETE", null, { silent: true }); }
    catch (e) {
      arr.splice(ix, 0, removed);
      if (noteEl) { noteEl.remove(); noteEl = null; }
      if (dayCard) {
        const addBtn = dayCard.querySelector("#btn-add-place");

const PHRASE_ALIAS = { "Mỹ": "Anh", "Úc": "Anh", "Canada": "Anh", "Singapore": "Anh", "Malaysia": "Anh", "Hồng Kông": "Trung Quốc", "Ma Cao": "Trung Quốc", "New Zealand": "Anh", "Ireland": "Anh", "Iceland": "Anh", "Malta": "Anh", "Nam Phi": "Anh", "Pakistan": "Anh", "UAE": "Ai Cập", "Qatar": "Ai Cập", "Ả Rập Xê Út": "Ai Cập", "Morocco": "Ai Cập", "Jordan": "Ai Cập", "Áo": "Đức", "Thụy Sĩ": "Đức", "Bỉ": "Pháp", "Luxembourg": "Pháp", "Mexico": "Tây Ban Nha", "Argentina": "Tây Ban Nha", "Chile": "Tây Ban Nha", "Peru": "Tây Ban Nha", "Colombia": "Tây Ban Nha", "Brazil": "Bồ Đào Nha" };
function phraseSetFor(country) {
  if (!country) return null;
  if (PHRASES[country]) return { key: country, set: PHRASES[country] };
  const alias = PHRASE_ALIAS[country];
  if (alias && PHRASES[alias]) return { key: alias, set: PHRASES[alias] };
  const n = norm(country);
  for (const k in PHRASES) if (norm(k) === n) return { key: k, set: PHRASES[k] };
  return null;
}
let ttsAudio = null;
try { if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { try { speechSynthesis.getVoices(); } catch {} }; } } catch {}
function speakText(text, lang) {
  const main = (lang || "en").split("-")[0].toLowerCase();
  const tlMap = { fil: "tl", nb: "no", he: "iw" };
  let tl = tlMap[main] || main;
  if (main === "zh") tl = (lang || "").toLowerCase().includes("tw") ? "zh-TW" : "zh-CN";
  const fallback = () => {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || "en-US";
      const vs = speechSynthesis.getVoices();
      const v = vs.find(x => x.lang && x.lang.toLowerCase().startsWith((lang || "en").toLowerCase())) || vs.find(x => x.lang && x.lang.toLowerCase().startsWith(main));
      if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch { toast("Chưa phát được âm thanh 😢"); }
  };
  try {
    if (ttsAudio) { try { ttsAudio.pause(); } catch {} ttsAudio = null; }
    const a = new Audio("/api/tts?tl=" + encodeURIComponent(tl) + "&q=" + encodeURIComponent(text));
    ttsAudio = a;
    let settled = false;
    const fb = () => { if (!settled && ttsAudio === a) { settled = true; try { a.pause(); } catch {} fallback(); } };
    a.addEventListener("playing", () => { settled = true; });
    a.onerror = fb;
    setTimeout(() => { if (!settled && ttsAudio === a && a.readyState < 3) fb(); }, 2500);
    const pr = a.play();
    if (pr && pr.catch) pr.catch(fb);
  } catch { fallback(); }
}
function renderPhrases(v) {
  let html = '';
  let country = phraseState.custom || "";
  let fromTrip = false;
  if (!country) {
    const t = curTrip || trips[0];
    if (t && t.country) { country = t.country; fromTrip = true; }
  }
  const found = phraseSetFor(country);
  if (fromTrip && found) html += '<div class="mb"><span class="chip">🧭 Theo chuyến đi của bạn: ' + esc(country) + "</span></div>";
  html += '<div class="card mb"><select class="field" id="ph-country"><option value="">Chọn quốc gia…</option>' +
    Object.keys(PHRASES).map(k => '<option value="' + esc(k) + '"' + (found && found.key === k ? " selected" : "") + ">" + flagOf(k) + " " + esc(k) + "</option>").join("") +
    "</select></div>";

  if (!country) {
  } else if (!found) {
    html += '<div class="empty-note">Chưa có sẵn mẫu câu cho ' + esc(country) + '.</div>';
  } else {
    const set = found.set;
    for (const gname in set.groups) {
      html += '<div class="phrase-group"><h3>' + esc(gname) + "</h3>" + set.groups[gname].map(p =>
        '<div class="phrase"><div style="flex:1;min-width:0"><div class="t">' + esc(p.t) + "</div>" +
        (p.r ? '<div class="r">' + esc(p.r) + "</div>" : "") +
        '<div class="v">' + esc(p.vi) + '</div></div><button class="spk" data-say="' + esc(p.t) + '" data-lang="' + esc(set.voice) + '">' + ic("speaker") + '</button></div>'
      ).join("") + "</div>";
    }
  }
  v.innerHTML = html + '<div class="taskbar-spacer"></div>' + taskbarHTML(); bindNav(v);
  const phSel = $("#ph-country", v);
  if (phSel) phSel.onchange = () => { if (phSel.value) { phraseState.custom = phSel.value; render(); } };
  $$("[data-say]", v).forEach(b => b.onclick = () => speakText(b.dataset.say, b.dataset.lang));
}

async function ensurePrepTrip() {
  if (!trips.length) return null;

  if (!curTrip || curTrip.id !== prepTripId) { try { curTrip = await api("/api/trips/" + prepTripId); } catch {} }
  return curTrip;
}
async function renderPrep(v) {
  let html = '';
  const t = await ensurePrepTrip();
  if (!t) { v.innerHTML = html + '<div class="empty-note">Chưa có chuyến đi nào.</div><div class="taskbar-spacer"></div>' + taskbarHTML(); bindNav(v); return; }
  if (trips.length > 1) {
    html += '<div class="nav-row">' + trips.map(x => '<button data-prep-trip="' + x.id + '" class="' + (x.id === t.id ? "on" : "") + '">' + ic("pin") + esc(x.city) + "</button>").join("") + "</div>";
  }
  const groups = t.prep || [];
  const total = groups.reduce((a, g) => a + g.items.length, 0);
  const done = groups.reduce((a, g) => a + g.items.filter(i => i.done).length, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  html += '<div class="card mb"><div class="row-between"><b>' + esc(t.city) + " · " + fmtD(t.startDate) + " → " + fmtD(t.endDate) + '</b><span class="chip">' + done + "/" + total + " mục · " + pct + '%</span></div>' +
    '<div class="progress mt"><div style="width:' + pct + '%"></div></div></div>';

  html += '<div class="prep-grid">' + groups.map(g =>
    '<div class="prep-group ' + (g.highlight ? "hot" : "") + '"><div class="row-between"><h3>' + (g.highlight ? "⭐ " : "") + esc(g.name) + (g.highlight ? ' <span class="chip">Quan trọng</span>' : "") + '</h3><button class="del-x" data-del-group="' + g.id + '" title="Xóa nhóm">✕</button></div>' +
    g.items.map(i => '<div class="prep-item ' + (i.done ? "done" : "") + '"><button class="cbox ' + (i.done ? "on" : "") + '" data-toggle="' + g.id + ":" + i.id + '">✓</button><span class="txt">' + esc(i.text) + '</span><button class="del-x" data-del-item="' + g.id + ":" + i.id + '">✕</button></div>').join("") +
    '<div class="add-row"><input class="field" placeholder="Thêm mục vào nhóm này…" data-add-input="' + g.id + '"><button class="btn btn-teal btn-sm" data-add-item="' + g.id + '">' + ic("plus") + 'Thêm</button></div></div>'
  ).join("") + "</div>";
  html += '<div class="card"><b>➕ Tạo nhóm mới</b><div class="add-row"><input class="field" id="new-group-name" placeholder="VD: Đồ cho bé, Dụng cụ quay phim…"><button class="btn btn-coral btn-sm" id="btn-new-group">Tạo nhóm</button></div></div>';

  v.innerHTML = html + '<div class="taskbar-spacer"></div>' + taskbarHTML(); bindNav(v);
  $$("[data-prep-trip]", v).forEach(b => b.onclick = async () => { prepTripId = b.dataset.prepTrip; curTrip = null; render(); });
  $$("[data-toggle]", v).forEach(b => b.onclick = async () => {
    const [gid, iid] = b.dataset.toggle.split(":");
    const g = t.prep.find(x => x.id === gid); const item = g && g.items.find(x => x.id === iid);
    if (!item) return;
    try { await api("/api/trips/" + t.id + "/prep/groups/" + gid + "/items/" + iid, "PUT", { done: !item.done }); curTrip = await api("/api/trips/" + t.id); render(); }
    catch (e) { toast(e.message); }
  });
  $$("[data-del-item]", v).forEach(b => b.onclick = async () => {
    const [gid, iid] = b.dataset.delItem.split(":");
    try { await api("/api/trips/" + t.id + "/prep/groups/" + gid + "/items/" + iid, "DELETE"); curTrip = await api("/api/trips/" + t.id); render(); }
    catch (e) { toast(e.message); }
  });
  $$("[data-del-group]", v).forEach(b => b.onclick = async (e) => {
    const btn = e.currentTarget;
    if (!btn.dataset.arm) { btn.dataset.arm = "1"; btn.textContent = "?"; btn.style.background = "#FFD9C0"; setTimeout(() => { btn.dataset.arm = ""; btn.textContent = "✕"; }, 2500); return; }
    try { await api("/api/trips/" + t.id + "/prep/groups/" + b.dataset.delGroup, "DELETE"); curTrip = await api("/api/trips/" + t.id); render(); }
    catch (err) { toast(err.message); }
  });
  $$("[data-add-item]", v).forEach(b => b.onclick = async () => {
    const inp = $('[data-add-input="' + b.dataset.addItem + '"]', v);
    const text = inp.value.trim(); if (!text) return;
    try { await api("/api/trips/" + t.id + "/prep/groups/" + b.dataset.addItem + "/items", "POST", { text }); curTrip = await api("/api/trips/" + t.id); render(); }
    catch (e) { toast(e.message); }
  });
  $("#btn-new-group", v).onclick = async () => {
    const name = $("#new-group-name", v).value.trim(); if (!name) return toast("Bạn nhập tên nhóm nhé");
    try { await api("/api/trips/" + t.id + "/prep/groups", "POST", { name }); curTrip = await api("/api/trips/" + t.id); render(); }
    catch (e) { toast(e.message); }
  };
}

/* ================= Man hinh cho (splash) =================
   Vong doi dung nhu ban Muse: "show" (~1.5s, hoac cham de vao ngay)
   -> "leaving" (mo dan 0.5s, trang chu nhan .app-enter mo/troi vao)
   -> "gone" (go khoi DOM sau 550ms). Chi hien o lan mo app dau tien. */
let splashState = "show";
function splashLeave() {
  if (splashState !== "show") return;
  splashState = "leaving";
  const sp = document.getElementById("splash");
  if (sp) sp.classList.add("bye");
  const v = document.getElementById("view");
  if (v) v.classList.add("app-enter");
  setTimeout(() => { splashState = "gone"; if (sp && sp.parentNode) sp.remove(); }, 550);
  // Go han class sau khi animation chay xong: neu de lai, keyframe cuoi giu transform
  // tren #view -> #view thanh khung chua cua moi phan tu position:fixed ben trong
  // (thanh taskbar o trang Lich trinh bi neo theo chieu cao noi dung thay vi day man hinh)
  setTimeout(() => { if (v) v.classList.remove("app-enter"); }, 700);
}
const splashEl = document.getElementById("splash");
if (splashEl) splashEl.addEventListener("click", splashLeave);
setTimeout(splashLeave, 1500);
window.addEventListener("pageshow", (e) => { if (e.persisted) splashLeave(); });

/* ================= Khoi dong ================= */
(async function init() {
  loaderHoldShow("Đang tải Travel Plan… ✈️");
  try {
    const [g, c, p, ts, gc, me] = await Promise.all([
      fetch("data/guides.json").then(r => r.json()),
      fetch("data/cities.json").then(r => r.json()),
      fetch("data/phrases.json").then(r => r.json()),
      api("/api/trips"),
      api("/api/guide-cache").catch(() => ({ cities: {} })),
      api("/api/me").catch(() => ({ user: null, authConfigured: false }))
    ]);
    GUIDES = g.cities || {};
    for (const k in (gc.cities || {})) if (!GUIDES[k]) GUIDES[k] = gc.cities[k];
    CITYLIST = Array.isArray(c) ? c : (((c && c.cities) || []).map(a => ({ name: a[0], country: ((c && c.countries) || [])[a[1]] || "" })));
    PHRASES = p.countries || {}; trips = ts || [];
    ME = me.user || null; AUTH_OK = !!me.authConfigured;
    if (ME) {
      try { const j = await api("/api/journal"); journalIds = new Set(j.map(e => e.tripId)); } catch {}
    }
    if (trips.length) { selTripId = trips[0].id; prepTripId = trips[0].id; }
    // Dat mac dinh: ngay di = hom nay, ngay ve = +2
    homeForm.start = todayISO(); homeForm.end = addDays(todayISO(), 2);
  } catch (e) {
    $("#view").innerHTML = '<div class="empty-note">Chưa tải được dữ liệu. Bạn kiểm tra lại kết nối rồi mở lại app nhé.</div>';
    loaderRelease();
    return;
  }
  // Thong bao sau khi quay ve tu trang dang nhap Google
  const aq = new URLSearchParams(location.search).get("authmsg");
  if (aq) {
    history.replaceState(null, "", location.pathname);
    if (aq === "unconfigured") setTimeout(() => toast("Chưa cấu hình đăng nhập Google 🔐 — xem hướng dẫn trong README nhé"), 350);
    else if (aq === "error") setTimeout(() => toast("Đăng nhập Google chưa thành công, bạn thử lại nhé"), 350);
  }
  render();
  loaderRelease();
})();

/* ===== Dong bo: tu lam moi khi quay lai app + vuot xuong de cap nhat ===== */
let lastFetchAt = 0, ptrRefreshing = false, bootVersion = null;
async function checkAppVersion() {
  try {
    const r = await fetch("/api/app-version", { cache: "no-store" });
    const j = await r.json();
    if (!j || !j.v) return false;
    if (!bootVersion) { bootVersion = j.v; return false; }
    if (j.v !== bootVersion) { location.reload(); return true; }
  } catch {}
  return false;
}
checkAppVersion();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("/sw.js").catch(() => {}); } catch {} }
function fitBg() {
  try {
    const root = document.documentElement;
    if (!(window.screen && window.screen.height)) return;
    const portrait = window.matchMedia && matchMedia("(orientation: portrait)").matches;
    const vScreen = portrait ? Math.max(window.screen.width, window.screen.height) : Math.min(window.screen.width, window.screen.height);
    let gap = vScreen - window.innerHeight;
    const sa = window.navigator.standalone === true || (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
    if (sa || (gap >= 1 && gap <= 120)) {
      root.style.setProperty("--bgh", vScreen + "px");
      if (!(gap > 0)) gap = 0; if (gap > 90) gap = 90;
      root.style.setProperty("--gap", gap + "px");
    } else { root.style.removeProperty("--bgh"); root.style.removeProperty("--gap"); }
  } catch {}
}
fitBg();
addEventListener("resize", fitBg);
addEventListener("orientationchange", fitBg);
addEventListener("load", fitBg);
setTimeout(fitBg, 400); setTimeout(fitBg, 1200);
addEventListener("pointerdown", fitBg, { once: true });
async function refreshData() {
  try {
    if (await checkAppVersion()) return;
    trips = await api("/api/trips");
    if (curTrip) { try { curTrip = await api("/api/trips/" + curTrip.id); } catch { curTrip = null; } }
    if (ME) { try { const j = await api("/api/journal"); journalIds = new Set(j.map(e => e.tripId)); } catch {} }
    lastFetchAt = Date.now();
    render();
  } catch (e) { /* cap nhat am tham, khong hien thong bao */ }
}
function editingNow() { const a = document.activeElement, vw = document.querySelector("#view"); return !!(a && vw && vw.contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")); }
function autoRefresh() {
  if (document.hidden) return;
  if (Date.now() - lastFetchAt < 8000) return;
  if (editingNow()) return;
  const mr = document.querySelector("#modal-root");
  if (mr && mr.children.length) return;
  refreshData();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) autoRefresh(); });
window.addEventListener("focus", autoRefresh);
let ptrY = null, ptrD = 0;
document.addEventListener("touchstart", (e) => { ptrD = 0; ptrY = (window.scrollY <= 0 && !(e.target.closest && e.target.closest("#modal-root"))) ? e.touches[0].clientY : null; }, { passive: true });
document.addEventListener("touchmove", (e) => {
  if (ptrY == null || ptrRefreshing) return;
  const dy = e.touches[0].clientY - ptrY, b = document.getElementById("ptr");
  if (dy > 10 && window.scrollY <= 0) { ptrD = dy; if (b) b.classList.add("show"); }
  else { ptrD = 0; if (b) b.classList.remove("show"); }
}, { passive: true });
document.addEventListener("touchend", async () => {
  const b = document.getElementById("ptr");
  if (ptrD >= 70 && !ptrRefreshing) {
    ptrRefreshing = true;
    if (b) b.classList.add("show");
    await refreshData();
    ptrRefreshing = false;
  }
  if (b) b.classList.remove("show");
  ptrY = null; ptrD = 0;
});
</script>
